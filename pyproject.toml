[project]
name = "md-iator"
version = "0.1.0"
description = "Convertit des fichiers DOCX et PDF en Markdown."
requires-python = ">=3.10"
dependencies = [
    "pypandoc>=1.17",
    "pdfplumber>=0.11.10",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
md-iator = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["md_iator", "main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
